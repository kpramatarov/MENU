amily="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">RTT ≈ 2,8…4,0 ms; до ≈ 29 ms при съвпадение с четенето на DHT11</text><text x="390" y="372" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">Времената са изчислени за 1 Mbit/s (802.11b); мащабът по времето не е спазен.</text><text x="390.0" y="414" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Фиг. 4.2. Времедиаграма на един обмен при теста PING</text></svg>