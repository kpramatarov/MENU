9" font-weight="normal" text-anchor="start">изваждане от опашката</text><polyline points="380,300 150,300 150,145" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#m)"/><text x="265" y="290" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">millis() − t_пауза ≥ 250 ms</text><path d="M84 100 q-52 -42 -6 -62 q44 -18 62 36" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#m)"/><text x="40" y="24" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="start">брой = 0</text><rect x="100.0" y="370.0" width="640" height="84" fill="#f7f7f7" stroke="#000" stroke-width="1.6"/><text x="420" y="393.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Интервалът от 250 ms между командите произтича от т. 2.4.6: едновременното</text><text x="420" y="408.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">задействане на четирите канала натоварва изводите с 31,5 mA.</text><text x="420" y="423.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">Последователното превключване ограничава пиковия ток до стойността</text><text x="420" y="438.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">на един канал – 7,88 mA.</text><text x="390.0" y="466" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Фиг. 3.4. Автомат на неблокиращата опашка от команди</text></svg>