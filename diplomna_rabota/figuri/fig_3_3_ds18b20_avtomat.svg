"1.5" marker-end="url(#m)"/><text x="150" y="254" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">иначе: връщане</text><path d="M610 157 q52 40 -4 54 q-38 9 -40 -25" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#m)"/><text x="610" y="254" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">иначе: връщане</text><rect x="60.0" y="287.0" width="640" height="66" fill="#f7f7f7" stroke="#000" stroke-width="1.6"/><text x="380" y="309.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">setWaitForConversion(false) превръща 750 ms блокиращо изчакване в две</text><text x="380" y="324.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">неблокиращи операции. Времето за един цикъл спада от 750 ms до 1…2 ms –</text><text x="380" y="339.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle">намаление 375 пъти.</text><text x="380.0" y="380" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Фиг. 3.3. Неблокиращо четене на датчика DS18B20</text></svg>