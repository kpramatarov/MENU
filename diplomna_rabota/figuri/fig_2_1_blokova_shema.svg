="10" font-weight="normal" text-anchor="start" fill="#000">по USB, подчиненият – от захранващия блок AC/DC, който осигурява и</text><text x="32" y="742" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="start" fill="#000">галваничното разделяне на управляващата част от мрежата ~230 V.</text><text x="645.0" y="800" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#000">Фиг. 2.1. Блокова схема на хардуера</text></svg>