<svg xmlns="http://www.w3.org/2000/svg" width="780" height="312" viewBox="0 0 780 312"><rect width="780" height="312" fill="#fff"/><text x="390.0" y="36" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Разпределение на еднопосочното закъснение при ESP-NOW</text><text x="390.0" y="56" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="normal" text-anchor="middle" fill="#555">Сумарно 2676 µs = 2.68 ms</text><rect x="60.0" y="100" width="22.7" height="58" fill="#d9d9d9" stroke="#1a1a1a" stroke-width="1"/><line x1="72.3" y1="158" x2="72.3" y2="167" stroke="#9a9a9a" stroke-width="1"/><text x="60" y="176" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1a1a1a">Съставяне на пакета (100 µs)</text><rect x="84.7" y="100" width="4.9" height="58" fill="#bfbfbf" stroke="#1a1a1a" stroke-width="1"/><line x1="88.1" y1="158" x2="88.1" y2="183" stroke="#9a9a9a" stroke-width="1"/><text x="60" y="192" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1a1a1a">DIFS (28 µs)</text><rect x="91.6" y="100" width="32.4" height="58" fill="#a6a6a6" stroke="#1a1a1a" stroke-width="1"/><line x1="108.8" y1="158" x2="108.8" y2="199" stroke="#9a9a9a" stroke-width="1"/><text x="60" y="208" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9" font-weight="normal" text-anchor="start" fill="#1a1a1a">Отдръпване (140 µs)</text><rect x="126.0" y="100" width="562.4" height="58" fill="#6e6e6e" stroke="#1a1a1a" stroke-width="1"/><text x="408.1928611474491" y="133.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2288 µs</text><text x="408.1928611474491" y="176" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="9.5"