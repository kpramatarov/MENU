<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="500" viewBox="0 0 780 500"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#000"/></marker><marker id="as" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto"><polygon points="9 0, 0 3.5, 9 7" fill="#000"/></marker></defs><rect width="780" height="500" fill="#fff"/><rect x="30.0" y="157.0" width="220" height="86" rx="14" fill="#fff" stroke="#000" stroke-width="1.7"/><text x="140" y="188" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">НОРМАЛЕН РЕЖИМ</text><text x="140" y="206" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">релетата се управляват</text><text x="140" y="222" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">от всички източници</text><rect x="460.0" y="67.0" width="290" height="86" rx="14" fill="#f0f0f0" stroke="#000" stroke-width="1.7"/><text x="605" y="98" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">БЛОКИРОВКА – МОКРО</text><text x="605" y="116" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">релетата са изключени,</text><text x="605" y="132" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">включването е забранено</text><rect x="460.0" y="287.0" width="290" height="86" rx="14" fill="#f0f0f0" stroke="#000" stroke-width="1.7"/><text x="605" y="318" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">БЛОКИРОВКА – ИЗЧАКВАНЕ</text><text x="605" y="336" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">сухо по-малко от 2 s,</text><text x="605" y="352" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">включването е забранено</text><circle cx="140" cy="118" r="7" fill="#000"/><polyline points="140,125 140,157" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><polyline points="250,180 300,180 300,110 460,110" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="380" y="100" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">DO = 0 (влага) /</text><text x="380" y="128" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">allRelaysOff(); брояч;</text><text x="380" y="143" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">отчет „събитие"</text><polyline points="690,153 690,287" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="698" y="214" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="start" fill="#000">DO = 1</text><text x="698" y="229" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="start" fill="#000">(сухо)</text><polyline points="520,287 520,153" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="512" y="214" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="end" fill="#000">DO = 0 /</text><text x="512" y="229" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="end" fill="#000">lastWetMs ← now</text><polyline points="460,330 140,330 140,243" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="300" y="322" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">сухо ≥ 2 s / отчет „събитие";</text><text x="300" y="348" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">релетата остават изключени</text><path d="M 560 67 C 560 22, 650 22, 650 67" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="605" y="20" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="italic" text-anchor="middle" fill="#000">DO = 0 / lastWetMs ← now</text><rect x="24" y="392" width="732" height="54" rx="4" fill="#fff" stroke="#000" stroke-width="1.1" stroke-dasharray="5 3"/><text x="36" y="414" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">В състоянията на блокировка applyRelay(…, включено) се отказва и броячът на отказите</text><text x="36" y="432" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">се увеличава; изключването е разрешено винаги. DO – изход на датчика за влага HR202.</text><text x="390.0" y="484" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Фиг. 3.6. Краен автомат на защитната блокировка при влага</text></svg>