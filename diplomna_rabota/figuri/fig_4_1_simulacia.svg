<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="624" viewBox="0 0 780 624"><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#000"/></marker><marker id="as" markerWidth="9" markerHeight="7" refX="0.5" refY="3.5" orient="auto"><polygon points="9 0, 0 3.5, 9 7" fill="#000"/></marker></defs><rect width="780" height="624" fill="#fff"/><rect x="20" y="18" width="740" height="64" rx="4" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/><text x="390.0" y="38.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Въздействия („потребители“)</text><text x="390.0" y="55.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">браузър (/data всяка секунда, команди), тест PING, бутони с трептене,</text><text x="390.0" y="71.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">намокряне на HR202, грешки на DHT11, рестарти, прекъсвания на връзката</text><rect x="20" y="130" width="300" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="170.0" y="177.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Подчинен възел</text><text x="170.0" y="194.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Slave.ino – без промени</text><text x="170.0" y="210.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">имитация: DHT11, HR202, бутони,</text><text x="170.0" y="226.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">релета, АЦП, EEPROM, UART,</text><text x="170.0" y="242.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">собствен часовник (µs)</text><rect x="460" y="130" width="300" height="150" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="610.0" y="177.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Главен възел</text><text x="610.0" y="194.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">Master.ino – без промени</text><text x="610.0" y="210.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">имитация: уеб сървър, UART,</text><text x="610.0" y="226.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">EEPROM, собствен часовник (µs)</text><text x="610.0" y="242.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">рестарт = ново зареждане</text><polyline points="170,82 170,130" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="178" y="110" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">изводи</text><polyline points="610,82 610,130" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><text x="618" y="110" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="start" fill="#000">HTTP, UART</text><rect x="170" y="330" width="440" height="96" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="390.0" y="366.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Модел на радиоканала (IEEE 802.11b, 1 Mbit/s)</text><text x="390.0" y="383.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">DIFS, случайно изчакване с удвояване, до 7 опита, ACK;</text><text x="390.0" y="399.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">грешки с вероятност FER, дублиране, фонов трафик, прекъсвания</text><polyline points="170,280 170,305 330,305 330,330" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="8 4" marker-end="url(#a)" marker-start="url(#as)"/><polyline points="610,280 610,305 450,305 450,330" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="8 4" marker-end="url(#a)" marker-start="url(#as)"/><text x="250" y="298" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">отчети</text><text x="530" y="298" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">команди</text><rect x="20" y="470" width="440" height="96" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="240.0" y="498.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Проверки по време на симулацията</text><text x="240.0" y="515.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">защита при влага, съгласуваност на състоянието,</text><text x="240.0" y="531.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">отчитане на загубите, напредък на опашката,</text><text x="240.0" y="547.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">период на отчетите</text><rect x="500" y="470" width="260" height="96" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/><text x="630.0" y="506.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Резултати</text><text x="630.0" y="523.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">обобщение (JSON), закъснения (CSV),</text><text x="630.0" y="539.0" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="11.5" font-weight="normal" font-style="normal" text-anchor="middle" fill="#000">записи по UART на двата възела</text><polyline points="240,426 240,470" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><polyline points="460,518 500,518" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><line x1="20" y1="205" x2="12" y2="205" stroke="#000" stroke-width="1.2"/><line x1="12" y1="205" x2="12" y2="518" stroke="#000" stroke-width="1.2"/><polyline points="12,518 20,518" fill="none" stroke="#000" stroke-width="1.4" marker-end="url(#a)"/><line x1="760" y1="205" x2="772" y2="205" stroke="#000" stroke-width="1.2"/><line x1="772" y1="205" x2="772" y2="452" stroke="#000" stroke-width="1.2"/><line x1="772" y1="452" x2="240" y2="452" stroke="#000" stroke-width="1.2"/><text x="390.0" y="608" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" text-anchor="middle" fill="#000">Фиг. 4.1. Структура на симулационния модел</text></svg>